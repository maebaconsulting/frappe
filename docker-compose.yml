# Stack Frappe / ERPNext pour Dokploy, en mode Docker Compose.
#
# Mode Compose obligatoire, pas Docker Stack : les services « configurator » et
# « create-site » sont éphémères et les autres services en dépendent via
# service_completed_successfully. En mode Swarm, ces conteneurs seraient
# redémarrés en boucle et la condition ne serait jamais satisfaite.
#
# Structure et commandes reprises de pwd.yml du dépôt frappe/frappe_docker.

x-frappe-image: &frappe_image
  image: ${ERP_IMAGE}
  pull_policy: always
  restart: unless-stopped
  networks:
    - frappe-network

x-backend-defaults: &backend_defaults
  <<: *frappe_image
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  # Écrit sites/common_site_config.json : hôte de base de données, Redis, port socketio.
  configurator:
    <<: *frappe_image
    restart: "no"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"

  # Crée le site et installe les applications. Idempotent : si sites/$SITE_NAME
  # existe déjà, le conteneur sort en code 0 sans rien toucher, pour qu'un
  # redéploiement Dokploy ne détruise pas l'installation existante.
  create-site:
    <<: *frappe_image
    restart: "no"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      SITE_NAME: ${SITE_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Attente de la création de sites/common_site_config.json";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "sites/common_site_config.json introuvable ou incomplet";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json trouvé";
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Le site $$SITE_NAME existe déjà, aucune action";
          exit 0;
        fi;
        echo "Création du site $$SITE_NAME";
        bench new-site --mariadb-user-host-login-scope='%' --admin-password=$$ADMIN_PASSWORD --db-root-username=root --db-root-password=$$DB_ROOT_PASSWORD --install-app erpnext --install-app payments --install-app hrms --install-app crm --install-app builder --install-app drive --set-default $$SITE_NAME;
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  backend:
    <<: *backend_defaults
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

  websocket:
    <<: *backend_defaults
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

  scheduler:
    <<: *backend_defaults
    command:
      - bench
      - schedule

  queue-short:
    <<: *backend_defaults
    command:
      - bench
      - worker
      - --queue
      - short,default
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

  queue-long:
    <<: *backend_defaults
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

  # Nginx interne. Aucun port publié sur l'hôte : Traefik, qui vit sur
  # dokploy-network, atteint directement le port 8080 du conteneur.
  frontend:
    <<: *frappe_image
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      # Doit valoir exactement le nom du site. Frappe résout le site depuis
      # l'en-tête Host ; toute divergence produit un « Site not found ».
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      # Aligné sur le plafond Cloudflare des plans Free et Pro.
      CLIENT_MAX_BODY_SIZE: 100m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - frappe-network
      - dokploy-network
    depends_on:
      - backend
      - websocket

  db:
    image: mariadb:11.8
    restart: unless-stopped
    networks:
      - frappe-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    networks:
      - frappe-network

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    networks:
      - frappe-network
    volumes:
      - redis-queue-data:/data

volumes:
  sites:
  logs:
  db-data:
  redis-queue-data:

networks:
  frappe-network:
    driver: bridge
  # Réseau créé par Dokploy, sur lequel Traefik est raccordé.
  dokploy-network:
    external: true
